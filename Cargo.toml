[package]
name = "colporteur"
version = "0.2.4"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "CLI tool for converting newsletter emails to web-friendly formats"

[lib]
name = "colporteur"
path = "src/lib.rs"

[[bin]]
name = "colporteur"
path = "src/main.rs"

[dependencies]
ammonia = "4"
atom_syndication = "0.12"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
env_logger = "0.11"
eyre = "0.6"
imap = "3.0.0-alpha.15"
log = "0.4"
mailparse = "0.16"
native-tls = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
